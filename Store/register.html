<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in to your StyleStore account" />
  <title>Sign In — StyleStore</title>
  <link rel="shortcut icon" href="images/bag-shopping-solid.svg" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body class="auth-page">

  <header id="headerElement">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="images/IMG_20241124_141913_439.png" alt="StyleStore Logo" />
      </a>
      <div class="header-actions">
        <a href="cart.html" class="cart-link" aria-label="Shopping cart">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="cart-total" id="cartTotalHeader">$0.00</span>
          <span class="badge-count" id="cartCountHeader">0</span>
        </a>
        <a class="btn-outline" href="signin.html"><i class="fa-solid fa-right-to-bracket"></i> Sign in</a>
        <a class="btn-solid" href="register.html"><i class="fa-solid fa-user-plus"></i> Register</a>
      </div>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">

      <div class="auth-tabs">
        <button class="auth-tab active" id="tabSignIn" onclick="switchTab('signin')">Sign In</button>
        <button class="auth-tab" id="tabSignUp" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- Sign In Form -->
      <div class="auth-form active" id="formSignIn">
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Sign in to your account</p>

        <div class="input-group">
          <i class="fa-solid fa-user input-icon"></i>
          <input type="text" id="signinUsername" placeholder="Username or Email" required autocomplete="username" />
        </div>
        <div class="input-group">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="signinPassword" placeholder="Password" required autocomplete="current-password" />
          <button type="button" class="toggle-pass" onclick="togglePassword('signinPassword', this)" aria-label="Show password">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>

        <div class="auth-row">
          <label class="remember-label">
            <input type="checkbox" /> Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button class="btn-auth" onclick="handleSignIn()">Sign In</button>

        <div class="auth-divider"><span>or continue with</span></div>
        <div class="social-auth">
          <button class="social-btn" onclick="showToast('Google login coming soon!', 'info')"><i class="fa-brands fa-google"></i> Google</button>
          <button class="social-btn" onclick="showToast('Facebook login coming soon!', 'info')"><i class="fa-brands fa-facebook-f"></i> Facebook</button>
        </div>

        <p class="auth-switch">Don't have an account? <a onclick="switchTab('signup')">Sign Up</a></p>
      </div>

      <!-- Sign Up Form -->
      <div class="auth-form" id="formSignUp">
        <h2>Create Account</h2>
        <p class="auth-subtitle">Join us today</p>

        <div class="input-group">
          <i class="fa-solid fa-user input-icon"></i>
          <input type="text" id="regUsername" placeholder="Full Name" required />
        </div>
        <div class="input-group">
          <i class="fa-solid fa-envelope input-icon"></i>
          <input type="email" id="regEmail" placeholder="Email Address" required autocomplete="email" />
 </div>
        <div class="input-group">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="regPassword" placeholder="Password" required />
          <button type="button" class="toggle-pass" onclick="togglePassword('regPassword', this)" aria-label="Show password">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>

        <label class="remember-label terms-label">
          <input type="checkbox" id="termsCheck" /> I agree to the <a href="#">Terms &amp; Conditions</a>
        </label>

        <button class="btn-auth" onclick="handleSignUp()">Create Account</button>

        <p class="auth-switch">Already have an account? <a onclick="switchTab('signin')">Sign In</a></p>
      </div>

    </div>
  </main>

  <footer>
    <div class="footer-bottom" style="padding:1rem; text-align:center;">
      <p>Designed and developed by <span>Ali Hassan</span> © 2024. All rights reserved.</p>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="js/main.js"></script>
  <script>
    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      if (tab === 'signin') {
        document.getElementById('tabSignIn').classList.add('active');
        document.getElementById('formSignIn').classList.add('active');
      } else {
        document.getElementById('tabSignUp').classList.add('active');
        document.getElementById('formSignUp').classList.add('active');
      }
    }
    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.querySelector('i').className = isHidden ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
    }
    function handleSignIn() {
      const u = document.getElementById('signinUsername').value;
      const p = document.getElementById('signinPassword').value;
      if (!u || !p) { showToast('Please fill in all fields.', 'error'); return; }
      showToast('Signed in successfully! Redirecting...', 'success');
      setTimeout(() => window.location.href = 'index.html', 1500);
    }
    function handleSignUp() {
      const u = document.getElementById('regUsername').value;
      const e = document.getElementById('regEmail').value;
      const p = document.getElementById('regPassword').value;
      const t = document.getElementById('termsCheck').checked;
      if (!u || !e || !p) { showToast('Please fill in all fields.', 'error'); return; }
      if (!t) { showToast('Please accept the Terms & Conditions.', 'error'); return; }
      showToast('Account created! Welcome aboard!', 'success');
      setTimeout(() => switchTab('signin'), 1500);
    }
  </script>
</body>
</html>
