 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create your StyleStore account" />
  <title>Register — StyleStore</title>
  <link rel="shortcut icon" href="images/bag-shopping-solid.svg" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body class="auth-page">

  <header id="headerElement">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="images/IMG_20241124_141913_439.png" alt="StyleStore Logo" />
      </a>
      <div class="header-actions">
        <a href="cart.html" class="cart-link" aria-label="Shopping cart">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="cart-total" id="cartTotalHeader">$0.00</span>
          <span class="badge-count" id="cartCountHeader">0</span>
        </a>
        <a class="btn-outline" href="signin.html"><i class="fa-solid fa-right-to-bracket"></i> Sign in</a>
        <a class="btn-solid" href="register.html"><i class="fa-solid fa-user-plus"></i> Register</a>
      </div>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab" onclick="window.location.href='signin.html'">Sign In</button>
        <button class="auth-tab active">Sign Up</button>
      </div>

      <div class="auth-form active" id="formSignUp">
        <h2>Create Account</h2>
        <p class="auth-subtitle">Join our community today</p>

        <div class="input-group">
          <i class="fa-solid fa-user input-icon"></i>
          <input type="text" id="regUsername" placeholder="Full Name" required />
        </div>
        <div class="input-group">
          <i class="fa-solid fa-envelope input-icon"></i>
          <input type="email" id="regEmail" placeholder="Email Address" required />
        </div>
        <div class="input-group">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="regPassword" placeholder="Password" required />
          <button type="button" class="toggle-pass" onclick="togglePassword('regPassword', this)">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
        <div class="input-group">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="regConfirm" placeholder="Confirm Password" required />
        </div>

        <label class="remember-label terms-label">
          <input type="checkbox" id="termsCheck" /> I agree to the <a href="#">Terms &amp; Conditions</a>
        </label>

        <button class="btn-auth" onclick="handleSignUp()">Create Account</button>

        <div class="auth-divider"><span>or sign up with</span></div>
        <div class="social-auth">
          <button class="social-btn" onclick="showToast('Google sign up coming soon!', 'info')"><i class="fa-brands fa-google"></i> Google</button>
          <button class="social-btn" onclick="showToast('Facebook sign up coming soon!', 'info')"><i class="fa-brands fa-facebook-f"></i> Facebook</button>
        </div>

        <p class="auth-switch">Already have an account? <a href="signin.html">Sign In</a></p>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-bottom" style="padding:1rem; text-align:center;">
      <p>Designed and developed by <span>Ali Hassan</span> © 2024. All rights reserved.</p>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="javascript/main.js"></script>
  <script>
    function togglePassword(id, btn) {
 const input = document.getElementById(id);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.querySelector('i').className = isHidden ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
    }
    function handleSignUp() {
      const u = document.getElementById('regUsername').value;
      const e = document.getElementById('regEmail').value;
      const p = document.getElementById('regPassword').value;
      const c = document.getElementById('regConfirm').value;
      const t = document.getElementById('termsCheck').checked;
      if (!u || !e || !p || !c) { showToast('Please fill in all fields.', 'error'); return; }
      if (p !== c) { showToast('Passwords do not match.', 'error'); return; }
      if (!t) { showToast('Please accept the Terms & Conditions.', 'error'); return; }
      showToast('Account created successfully! Redirecting...', 'success');
      setTimeout(() => window.location.href = 'signin.html', 1500);
    }
  </script>
</body>
</html>
